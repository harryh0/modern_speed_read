<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple browser-based speed reading tool.">
  <title>Modern Speed Reader</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <button
        id="setup-toggle"
        class="setup-toggle"
        type="button"
        aria-expanded="true"
        aria-controls="setup-controls"
        aria-label="Hide text and speed controls"
        title="Hide text and speed controls"
      >
        <span id="setup-toggle-icon" class="setup-toggle-icon" aria-hidden="true"></span>
      </button>
      <h1>Modern Speed Reader</h1>
    </header>

    <div id="setup-controls">
      <section class="panel input-panel" aria-label="Reading text">
        <div
          id="text-input"
          class="text-input"
          contenteditable="true"
          role="textbox"
          aria-label="Text to speed read"
          aria-multiline="true"
          aria-describedby="character-count"
          data-placeholder="Paste your text"
          spellcheck="true"
        ></div>
        <p id="character-count" class="character-count">0 / 1000</p>
      </section>

      <section class="panel settings-panel" aria-label="Reading speed">
        <div class="slider-wrap">
          <div id="wpm-control" class="wpm-control">
            <output id="wpm-output" class="wpm-output" for="wpm-slider">300</output>
            <input
              id="wpm-slider"
              type="range"
              min="100"
              max="1000"
              step="25"
              value="300"
              aria-label="Reading speed in words per minute"
            >
          </div>
          <div class="pace-status" aria-live="polite">
            <span id="pace-label" class="pace-label">Proficient</span>
          </div>
          <div id="chunk-controls" class="chunk-controls" hidden>
            <div class="chunk-heading">
              <label for="chunk-slider">Chunk size</label>
              <output id="chunk-output" for="chunk-slider">1 word</output>
            </div>
            <input
              id="chunk-slider"
              class="chunk-slider"
              type="range"
              min="1"
              max="1"
              step="1"
              value="1"
            >
          </div>
        </div>
      </section>
    </div>

    <section class="panel reader-panel" aria-label="Speed reader">
      <div class="reader-toolbar">
        <button
          id="play-button"
          class="play-button"
          type="button"
          aria-label="Play"
          title="Play"
          disabled
        >
          <span id="button-icon" aria-hidden="true">▶</span>
          <span id="button-label" class="visually-hidden">Play</span>
        </button>
      </div>

      <div class="word-display">
        <span id="display-word" aria-live="polite" aria-atomic="true">
          Your words appear here
        </span>
      </div>
    </section>
  </main>

  <script type="module">
    await import(`./app.js?v=${Date.now()}`);
  </script>
</body>
</html>
